t}" alt="sticker">`:''}</button>`}).join('')}</div><div class="period-legend"><span><i class="dot" style="background:#f3b3c8"></i>Menstruasi</span><span>🎀 Stiker harian</span><span>♥ Ada jurnal</span></div><button class="primary" onclick="go('stickerday')">🎀 Hias tanggal terpilih</button><p class="muted">Pilih tanggal untuk menambahkan stiker, menulis jurnal, atau mencatat siklus.</p></div></section>`}if(view==='stickerday'){let picked=db.stickers?.[selected]||'';s=`<section class="panel"><h2>🎀 Sticker Calendar</h2><p class="muted">Pilih tanggal, lalu tempel stiker favorit di kalender. Pilihan tersimpan offline.</p><label class="field">Tanggal</label><input type="date" value="${selected}" onchange="selected=this.value;render()"><div class="stat">Tanggal pilihan: <b>${new Date(selected+'T12:00:00').toLocaleDateString('id-ID',{dateStyle:'full'})}</b></div><label class="field">Pilih stiker chibi</label><div class="sticker-grid">${stickerFiles.map((f,i)=>`<button class="sticker-choice ${picked===f?'selected':''}" onclick="chooseSticker('${f}')" aria-label="Pilih stiker ${i+1}"><img src="stickers/${f}" alt=""></button>`).join('')}</div><div class="sticker-actions"><button class="secondary" onclick="removeSticker()">Hapus stiker</button><button class="secondary" onclick="go('calendar')">Lihat kalender</button></div><button class="primary" style="margin-top:10px" onclick="go('journal')">Tulis jurnal tanggal ini ♡</button></section>`} if(view==='period'){let days=db.period.days||{},first=new Date(year,month,1).getDay(),total=new Date(year,month+1,0).getDate();let starts=Object.keys(days).filter(d=>days[d].flow==='start').sort();let last=starts[starts.length-1];let next='';if(last){let dt=new Date(last+'T12:00:00');dt.setDate(dt.getDate()+Number(db.period.cycleLength||28));next=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}let d=days[selected]||{flow:'',mood:'',symptoms:[]};const symptoms=['Kram','Kembung','Sakit kep ssList.add('selected');$('periodMood').value='${m}'">${m}</button>`).join('')}</div><input id="periodMood" type="hidden" value="${safe(d.mood||'')}"><label class="field">Gejala (pilih yang sesuai)</label><div class="symptoms">${symptoms.map(x=>`<label class="symptom-check"><input type="checkbox" value="${x}" ${(d.symptoms||[]).includes(x)?'checked':''}>${x}</label>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="savePeriod()">Simpan catatan ♡</button><div class="stat" style="margin-top:12px"><b>Perkiraan menstruasi berikutnya</b><br>${next?new Date(next+'T12:00:00').toLocaleDateString('id-ID',{dateStyle:'long'}):'Catat hari pertama menstruasi untuk mulai membuat perkiraan.'}<br><span class="muted">Perkiraan berdasarkan panjang siklus yang diatur, bukan kontrasepsi atau diagnosis medis.</span></div><label class="field">Panjang siklus (hari)</label><input type="number" id="cycleLength" min="15" max="60" value="${Number(db.period.cycleLength||28)}"><label class="field">Lama menstruasi biasanya (hari)</label><input type="number" id="periodLength" min="1" max="15" value="${Number(db.period.periodLength||5)}"><button class="secondary" style="width:100%;margin-top:8px" onclick="savePeriodSettings()">Simpan pengaturan siklus</button></section>`}if(view==='habits'){let c=db.checks[selected]||{};s=`<section class="panel"><h2>🌱 Little Habits</h2><label class="field">Tanggal</label><input type="date" value="${selected}" onchange="selected=this.value;render()">${db.habits.map((h,i)=>`<label class="check"><input type="checkbox" ${c[h]?'checked':''} onchange="toggleHabit(${i},this.checked)">${safe(h)}</label>`).join('')}<div class="line"><input type="text" id="newhabit" placeholder="Tambah kebiasaan..."><button class="secondary" onclick="addHabit()">Tambah</button></div><p class="muted">Setiap langkah kecil tetap berarti ♡</p></section>`}if(view==='photos'){s=`<section class="panel"><h2>🖼️ My Photos</h2><p>Ganti foto sesuai mood kamu. Foto pilihan disimpan di perangkat ini dan tersedia saat offline.</p><label class="field">Foto utama</label><img class="photo-preview" src="${db.photos.hero||'girl.jpg'}" alt="Foto utama"><label class="field">Pilih foto dari galeri iPhone</label><input type="file" accept="image/*" id="heroUpload" onchange="savePhoto(this,'hero')"><button class="secondary" style="width:100%;margin-top:8px" onclick="resetPhoto('hero')">Kembali ke ilustrasi awal</button><label class="field">Foto cover (opsional)</label><img class="photo-preview" src="${db.photos.cover||db.photos.hero||'girl.jpg'}" alt="Foto cover"><input type="file" accept="image/*" onchange="savePhoto(this,'cover')"><button class="secondary" style="width:100%;margin-top:8px" onclick="resetPhoto('cover')">Hapus foto cover</button><p class="note" style="margin-top:14px">Foto dikompres sebelum disimpan untuk menghemat ruang. Foto ikut dalam file backup, jadi simpan backup di tempat aman.</p></section>`}if(view==='notes'){s=`<section class="panel"><h2>💌 Important Notes</h2><button class="secondary" style="width:100%;margin-bottom:10px" onclick="go('photos')">🖼️ Ganti foto</button><div class="line"><input type="text" id="newtask" placeholder="To-do baru..."><button class="secondary" onclick="addTask()">Tambah</button></div>${db.tasks.map((t,i)=>`<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="db.tasks[${i}].done=this.checked;save();render()"><span style="${t.done?'text-decoration:line-through;opacity:.5':''}">${safe(t.text)}</span><button onclick="db.tasks.splice(${i},1);save();render()">✕</button></div>`).join('')}<h2 style="margin-top:25px">🌷 Important Dates</h2><div class="line"><input type="date" id="impdate" value="${today()}"><input type="text" id="imptext" placeholder="Acara / pengingat"><button class="secondary" onclick="addImportant()">+</button></div>${db.important.sort((a,b)=>a.date.localeCompare(b.date)).map((n,i)=>`<div class="task"><span><b>${safe(n.date)}</b><br>${safe(n.text)}</span><button onclick="db.important.splice(${i},1);save();render()">✕</button></div>`).join('')}</section><section class="panel"><h2>🔐 Backup & Privacy</h2><p class="note">Catatan disimpan secara lokal di browser. Bisa hilang jika data Safari dihapus atau perangkat diganti. Tidak ada akun, sinkronisasi, atau enkripsi khusus pada versi ini. Orang yang punya akses ke perangkat/browser bisa membacanya.</p><button class="primary" onclick="exportData()">⬇️ Export backup JSON</button><label class="field">Pulihkan dari backup</label><input type="file" accept="application/json" onchange="importData(this)"></section>`}$('screen').innerHTML=s}function chooseSticker(file){db.stickers??={};db.stickers[selected]=file;save();render()}function removeSticker(){if(db.stickers)delete db.stickers[selected];save();render()}function savePeriod(){const flow=$('flow').value,mood=$('periodMood').value,symptoms=[...document.querySelectorAll('.symptom-check input:checked')].map(x=>x.value);if(!flow&&!mood&&!symptoms.length){delete db.period.days[selected]}else{db.period.days[selected]={flow,mood,symptoms}}if(flow==='start'){const d=new Date(selected+'T12:00:00');for(let i=1;i<Number(db.period.periodLength||5);i++){d.setDate(d.getDate()+1);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(!db.period.days[k])db.period.days[k]={flow:'period',mood:'',symptoms:[]}}}save();alert('Catatan kalender tersimpan di perangkat ini ♡');render()}function savePeriodSettings(){const c=Math.max(15,Math.min(60,Number($('cycleLength').value)||28)),p=Math.max(1,Math.min(15,Number($('periodLength').value)||5));db.period.cycleLength=c;db.period.periodLength=p;save();render()}function savePhoto(el,key){const file=el.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Pilih file gambar ya.');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',0.78);db.photos[key]=data;save();render();alert('Foto berhasil diganti ♡')};img.onerror=()=>alert('Foto tidak bisa dibaca. Coba pilih foto lain.');img.src=reader.result};reader.readAsDataURL(file)}function resetPhoto(key){db.photos[key]='';save();render()}function setMood(m){db.entries[selected]??={};db.entries[selected].mood=m;save();render()}function saveEntry(){db.entries[selected]={...db.entries[selected],energy:Number($('energy').value),story:$('story').value,thanks:$('thanks').value};save();alert('Jurnal tersimpan di browser ini ♡')}function shift(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}render()}function toggleHabit(i,v){db.checks[selected]??={};db.checks[selected][db.habits[i]]=v;save()}function addHabit(){let t=$('newhabit').value.trim();if(t){db.habits.push(t);save();render()}}function addTask(){let t=$('newtask').value.trim();if(t){db.tasks.push({text:t,done:false});save();render()}}function addImportant(){let t=$('imptext').value.trim();if(t){db.important.push({date:$('impdate').value,text:t});save();render()}}function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='our-little-garden-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.entries||!Array.isArray(x.tasks)||!Array.isArray(x.habits)||!x.checks||!Array.isArray(x.important))throw Error();if(confirm('Pulihkan backup? Data saat ini akan diganti dengan isi backup. Buat export terbaru dulu jika perlu.')){db={...defaults(),...x,photos:{...defaults().photos,...(x.photos||{})},stickers:{...(x.stickers||{})},period:{...defaults().period,...(x.period||{}),days:{...((x.period||{}).days||{})}}};save();render()}}catch{alert('File backup tidak valid')}};r.readAsText(f)}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
